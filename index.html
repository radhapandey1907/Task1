<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Image Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>My Image Gallery</h1>
    <p>Upload and view your images</p>
  </header>

  <main class="container">
    <form id="uploadForm" class="panel">
      <h2>Add New Image</h2>
      <input type="file" id="imageUpload" accept="image/*" required>
      <input type="text" id="imageTitle" placeholder="Image title" required>
      <select id="imageCategory">
        <option value="nature">Nature</option>
        <option value="city">City</option>
        <option value="animals">Animals</option>
      </select>
      <button type="submit">Add Image</button>
      <p id="message"></p>
    </form>

    <nav class="filters">
      <button type="button" class="filter-btn active" data-filter="all">All</button>
      <button type="button" class="filter-btn" data-filter="nature">Nature</button>
      <button type="button" class="filter-btn" data-filter="city">City</button>
      <button type="button" class="filter-btn" data-filter="animals">Animals</button>
    </nav>

    <div id="gallery" class="gallery"></div>
    <p id="emptyMessage">No images yet. Add an image above.</p>
  </main>

  <div id="preview" class="preview">
    <button id="closePreview" class="close">×</button>
    <img id="previewImage" alt="Image preview">
    <p id="previewTitle"></p>
  </div>
  <script src="script.js"></script>
</body>
</html>
